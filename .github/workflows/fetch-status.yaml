name: Fetch & publish status cache

on:
  push:
    branches: [main]
  schedule:
    # Hourly safety net only. The 5-minute cadence comes from the Cloudflare
    # cron worker (cron-worker/), which dispatches this workflow via the API
    # because GitHub's own scheduler throttles short intervals.
    - cron: '0 * * * *'
  # Allow triggering manually from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one deployment at a time; cancel any in-progress run if a new
# one is triggered so the cache never lags more than one cycle behind.
# `cancel-in-progress: true` is also what keeps a run stuck on the
# github-pages environment gate from holding the group forever: with `false`,
# such a run blocks every later dispatch, which then gets cancelled while
# still pending and never publishes anything.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    # A healthy run takes ~1 minute; well under the 5-minute dispatch period.
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Restore the full dist from the most recent run so fetch-all.js can skip
      # services fetched within the last 5 minutes and icons already on disk.
      - name: Restore dist cache
        uses: actions/cache/restore@v4
        with:
          path: proxy/dist
          key: dist-${{ github.run_id }}
          restore-keys: dist-

      - name: Fetch all status pages
        run: node proxy/fetch-all.js

      - name: Build the status page
        run: node site/build.js

      - name: Upload fetch-error logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-error-logs
          path: proxy/dist/logs/
          if-no-files-found: ignore

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: proxy/dist/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # Clear logs before caching — they were already uploaded as an artifact and
      # must not accumulate across runs or be re-reported on the next cycle.
      - name: Clear fetch-error logs
        run: rm -rf proxy/dist/logs/

      # Save after deploy so the cache always reflects what was actually deployed.
      - name: Save dist cache
        uses: actions/cache/save@v4
        with:
          path: proxy/dist
          key: dist-${{ github.run_id }}

  report-fetch-errors:
    needs: fetch-and-deploy
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Download fetch-error logs
        id: download
        uses: actions/download-artifact@v4
        with:
          name: fetch-error-logs
          path: logs/
        continue-on-error: true

      - name: Report errors as GitHub issues
        if: steps.download.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs   = require('fs');
            const path = require('path');

            // Build a set of beta service IDs and an integration map from the catalog.
            const catalogSrc = fs.readFileSync('proxy/catalog.js', 'utf8');
            const CATALOG_MAP = new Function(`${catalogSrc}; return CATALOG;`)();
            const betaSet = new Set(
              Object.entries(CATALOG_MAP)
                .filter(([, s]) => s.beta)
                .map(([id]) => id)
            );
            const integrationMap = Object.fromEntries(
              Object.entries(CATALOG_MAP).map(([id, s]) => [id, s.type])
            );

            // GitHub rejects new comments once an issue reaches 2500 of them, which
            // permanently wedges this job for any service that keeps failing. Rotate
            // well before that ceiling: the saturated issue is closed as a duplicate
            // and a fresh successor takes over, linking back to what it continues.
            const COMMENT_LIMIT = 2000;

            // Ensure the shared beta label exists.
            const BETA_LABEL = 'beta';
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                name: BETA_LABEL, color: 'ffd700',
                description: 'Service is in beta — failures may be expected',
              });
            } catch (e) {
              if (e.status !== 422) throw e; // 422 = label already exists
            }

            const joinLines = (...parts) => parts.filter(Boolean).join('\n');

            const escapeHtml = (s) => s
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;');

            // A failure reads the same whether it is a one-off blip or the 45th
            // consecutive run, so triage means downloading CI artifacts to find out.
            // These two turn each comment into its own answer to that question.
            function humanizeAgo(fromIso, toIso) {
              const ms = new Date(toIso) - new Date(fromIso);
              if (!Number.isFinite(ms) || ms < 0) return null;
              const min = Math.round(ms / 60000);
              if (min < 60)   return `${min} minute${min === 1 ? '' : 's'}`;
              const hours = Math.round(min / 60);
              if (hours < 48) return `${hours} hour${hours === 1 ? '' : 's'}`;
              const days = Math.round(hours / 24);
              return `${days} day${days === 1 ? '' : 's'}`;
            }

            // Timestamp of the newest existing comment on the issue, or null when
            // this is the first report.
            async function previousReportAt(issue) {
              if (!issue.comments) return null;
              const { data } = await github.rest.issues.listComments({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                per_page: 100, page: Math.ceil(issue.comments / 100),
              });
              const last = data[data.length - 1];
              return last ? last.created_at : null;
            }

            // Parse a log file into individual error entries. proxy/fetch-all.js
            // appends one entry per failure, shaped as:
            //   [timestamp] [type] statusPageUrl=url
            //   <the full error: stack, plus any `Caused by:` chain>
            //   <blank line>
            //
            // Everything after the header line is the error itself and is kept
            // verbatim. An unrecognised header degrades the metadata; it must
            // never swallow the error that header introduces.
            function parseLogEntries(logContent) {
              return logContent
                .split(/\n\n+/)
                .map(e => e.trim())
                .filter(Boolean)
                .map(entry => {
                  const lines  = entry.split('\n');
                  const header = lines[0];
                  const body   = lines.slice(1).join('\n').trim();

                  // `statusPageUrl=` is the key fetch-all.js writes; `apiBase=`
                  // was used by earlier revisions and may sit in a restored log.
                  const full = header.match(/^\[([^\]]+)\] \[([^\]]+)\] (?:statusPageUrl|apiBase)=(.+)$/);
                  if (full) return { timestamp: full[1], type: full[2], url: full[3], body };

                  const typed = header.match(/^\[([^\]]+)\] \[([^\]]+)\] ?(.*)$/);
                  if (typed) return { timestamp: typed[1], type: typed[2], url: null, body: joinLines(typed[3], body) };

                  const stamped = header.match(/^\[([^\]]+)\] ?(.*)$/);
                  if (stamped) return { timestamp: stamped[1], type: null, url: null, body: joinLines(stamped[2], body) };

                  return { timestamp: null, type: null, url: null, body: entry };
                });
            }

            // Build a structured GitHub markdown comment from parsed log entries.
            // The error is rendered expanded: the whole point of the issue is to
            // show what failed without anyone having to click to find out.
            function buildCommentBody(serviceId, entries, reportedAt, jobUrl, history) {
              const cadence = history.previousAt
                ? `Previous report ${humanizeAgo(history.previousAt, reportedAt)} ago · ${history.count + 1} reports so far`
                : 'First report on this issue';

              const lines = [
                `### Fetch failures for \`${serviceId}\` (${entries.length} occurrence(s))`,
                `> Reported at \`${reportedAt}\` · [View CI run](${jobUrl})`,
                `> ${cadence}`,
                '',
              ];

              for (const { timestamp, type, url, body } of entries) {
                const error   = body || '(no details)';
                const summary = error.split('\n')[0];
                const meta    = [
                  timestamp ? `<code>${timestamp}</code>` : null,
                  type      ? `<code>${type}</code>`      : null,
                ].filter(Boolean).join(' · ');

                // Outrun any backtick run inside the error so the fence holds.
                const fence = '`'.repeat(
                  Math.max(3, ...[...error.matchAll(/`+/g)].map(m => m[0].length + 1))
                );

                lines.push('<details open>');
                lines.push(`<summary>${meta}${meta ? ' · ' : ''}<b>${escapeHtml(summary)}</b></summary>`);
                lines.push('');
                if (url) {
                  lines.push(`Status page: ${url}`);
                  lines.push('');
                }
                lines.push(fence);
                lines.push(error);
                lines.push(fence);
                lines.push('');
                lines.push('</details>');
                lines.push('');
              }

              return lines.join('\n');
            }

            const logFiles = fs.readdirSync('logs').filter(f => f.endsWith('.log'));
            if (logFiles.length === 0) {
              console.log('No error logs — nothing to report.');
              return;
            }

            for (const logFile of logFiles) {
              const serviceId       = path.basename(logFile, '.log');
              const logContent      = fs.readFileSync(path.join('logs', logFile), 'utf8');
              const issueTitle      = `[fetch-error] ${serviceId}`;
              const label           = `service: ${serviceId}`;
              const isBeta          = betaSet.has(serviceId);
              const integration     = integrationMap[serviceId];
              const integrationLabel = integration ? `integration: ${integration}` : null;

              // Create the per-service label if it does not already exist.
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner, repo: context.repo.repo,
                  name: label, color: '0e8a16',
                  description: `Fetch-failure reports for ${serviceId}`,
                });
              } catch (e) {
                if (e.status !== 422) throw e; // 422 = label already exists
              }

              // Create the per-integration label if it does not already exist.
              if (integrationLabel) {
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner, repo: context.repo.repo,
                    name: integrationLabel, color: '0075ca',
                    description: `Fetch-failure reports for the ${integration} integration`,
                  });
                } catch (e) {
                  if (e.status !== 422) throw e; // 422 = label already exists
                }
              }

              // Resolve the live issue for this service.
              //
              // Titles are `[fetch-error] <id>` for the original issue and
              // `[fetch-error] <id> (part N)` for every successor created by a
              // rotation, so the highest part number is always the live one.
              const partOf = (title) => {
                if (title === issueTitle) return 1;
                const m = title.match(/^\[fetch-error\] (.+) \(part (\d+)\)$/);
                return m && m[1] === serviceId ? Number(m[2]) : null;
              };
              const titleForPart = (n) =>
                n <= 1 ? issueTitle : `${issueTitle} (part ${n})`;

              const byPartDesc = (issues) => issues
                .map(i => ({ issue: i, part: partOf(i.title) }))
                .filter(x => x.part !== null)
                .sort((a, b) => b.part - a.part);

              // Retire a saturated issue and open its successor, linking both ways.
              async function rotate(saturated, currentPart) {
                const next = currentPart + 1;
                console.log(
                  `Issue #${saturated.number} has ${saturated.comments} comments; ` +
                  `rotating to part ${next}...`
                );

                const created = await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title: titleForPart(next), labels: [],
                  body: [
                    `Automated report: fetch failures were detected for service \`${serviceId}\`.`,
                    '',
                    `Continues #${saturated.number}, retired after reaching ` +
                    `${saturated.comments} comments (GitHub rejects new comments past 2500).`,
                  ].join('\n'),
                });
                console.log(`Created issue #${created.data.number}.`);

                // Forward pointer on the retired issue. Best effort: the hard
                // ceiling may already have been reached before this rotation.
                try {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner, repo: context.repo.repo,
                    issue_number: saturated.number,
                    body: `Comment limit reached. Reporting continues in #${created.data.number}.`,
                  });
                } catch (e) {
                  console.log(`Could not comment on #${saturated.number}: ${e.message}`);
                }

                // `duplicate` is what "Close as duplicate" records. Fall back to
                // `not_planned` if the API rejects that reason.
                try {
                  await github.rest.issues.update({
                    owner: context.repo.owner, repo: context.repo.repo,
                    issue_number: saturated.number,
                    state: 'closed', state_reason: 'duplicate',
                  });
                } catch (e) {
                  if (e.status !== 422) throw e;
                  console.log(`state_reason=duplicate rejected; closing #${saturated.number} as not_planned.`);
                  await github.rest.issues.update({
                    owner: context.repo.owner, repo: context.repo.repo,
                    issue_number: saturated.number,
                    state: 'closed', state_reason: 'not_planned',
                  });
                }

                // Wait for GitHub to fully index the new issue before commenting.
                await new Promise(r => setTimeout(r, 3000));
                return { issue: created.data, part: next };
              }

              let issue;
              let part;

              const open = await github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                state: 'open', labels: label, per_page: 100,
              });
              const openCandidates = byPartDesc(open.data);

              if (openCandidates.length > 0) {
                ({ issue, part } = openCandidates[0]);
                console.log(`Found existing open issue #${issue.number} for ${serviceId}.`);
              } else {
                const closed = await github.rest.issues.listForRepo({
                  owner: context.repo.owner, repo: context.repo.repo,
                  state: 'closed', labels: label, per_page: 100,
                });
                const closedCandidates = byPartDesc(closed.data);

                // Only ever reopen the most recent part, and only if it can still
                // take comments. A rotated-out issue sits at the ceiling, so
                // commenting on it would fail all over again, and reviving an
                // older part while a newer one exists would scramble the history.
                // When the latest part is unusable, start a fresh one instead.
                const latest   = closedCandidates[0];
                const reusable = latest
                  && latest.issue.state_reason !== 'duplicate'
                  && latest.issue.comments < COMMENT_LIMIT
                  ? latest
                  : null;

                if (reusable) {
                  console.log(`Reopening closed issue #${reusable.issue.number} for ${serviceId}...`);
                  await github.rest.issues.update({
                    owner: context.repo.owner, repo: context.repo.repo,
                    issue_number: reusable.issue.number, state: 'open',
                  });
                  ({ issue, part } = reusable);
                } else {
                  part = latest ? latest.part + 1 : 1;
                  console.log(`Creating issue for ${serviceId} (part ${part})...`);
                  const created = await github.rest.issues.create({
                    owner: context.repo.owner, repo: context.repo.repo,
                    title: titleForPart(part), labels: [],
                    body: `Automated report: fetch failures were detected for service \`${serviceId}\`.`,
                  });
                  issue = created.data;
                  console.log(`Created issue #${issue.number}.`);
                  // Wait for GitHub to fully index the new issue before commenting.
                  await new Promise(r => setTimeout(r, 3000));
                }
              }

              // Rotate before commenting if the issue is already at the ceiling.
              if (issue.comments >= COMMENT_LIMIT) {
                ({ issue, part } = await rotate(issue, part));
              }

              // Ensure required labels are present on every create or comment.
              const currentLabels = issue.labels.map(l => l.name);
              const requiredLabels = [
                label,
                ...(integrationLabel ? [integrationLabel] : []),
                ...(isBeta ? [BETA_LABEL] : []),
                'bug',
              ];
              const missingLabels  = requiredLabels.filter(l => !currentLabels.includes(l));
              if (missingLabels.length > 0) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number, labels: missingLabels,
                });
              }

              const reportedAt = new Date().toISOString().replace(/\.\d{3}Z$/, 'Z');
              const jobUrl     = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              const entries    = parseLogEntries(logContent);
              const previousAt = await previousReportAt(issue);
              const body       = buildCommentBody(serviceId, entries, reportedAt, jobUrl,
                                                  { previousAt, count: issue.comments });

              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, body,
              });
              console.log(`Commented on issue #${issue.number}.`);
            }
